name: PracticeCloud checks
on:
  push:
    branches: [main, marketing-command-centre-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/marketing.test.cjs
      - run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gdsxouwknkeyhijdgiqg.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
