<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-labelledby="title desc">
<title id="title">J&amp;J Practice Cloud stitched leather mark</title>
<desc id="desc">Transparent blue and turquoise stitched leather healthcare cloud logo.</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#063b8f"/>
    <stop offset=".48" stop-color="#0877d6"/>
    <stop offset="1" stop-color="#032b73"/>
  </linearGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#65eff0"/>
    <stop offset=".45" stop-color="#17cfd5"/>
    <stop offset="1" stop-color="#057ca7"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff7e5"/>
    <stop offset=".5" stop-color="#baa989"/>
    <stop offset="1" stop-color="#f5ead2"/>
  </linearGradient>
  <filter id="leather" x="-15%" y="-15%" width="130%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#001c42" flood-opacity=".35"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001c42" flood-opacity=".32"/>
  </filter>
</defs>

