<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 87" role="img" aria-labelledby="title desc">
<title id="title">J&amp;J Practice Cloud metallic mark</title>
<desc id="desc">Metallic blue and cyan cloud, healthcare cross, analytics bars and stethoscope mark.</desc>
<defs>
